name: deploy-api

# Builds the API image, pushes it to ECR, migrates the production database, then deploys the api
# CloudFormation stack with ImageTag = this commit. Every other stack parameter (the secrets too)
# keeps its value, so nothing is typed in the console and the stack always matches what's
# running. Runs on every push to main that touches the API, or by hand ("Run workflow").
# See infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infra/api.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
    inputs:
      migrate:
        description: Run database migrations and the catalog sync before deploying
        type: boolean
        default: true
      image_tag:
        description: "Rollback: deploy this existing image (a commit SHA in ECR) instead of building. Skips migrations."
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # sign in to AWS as overloader-github-deploy (no stored AWS keys)

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  STACK: overloader-api
  FUNCTION: overloader-api
  REPOSITORY: overloader-api

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # No GitHub "environment" here on purpose: it would change the identity GitHub presents to
    # AWS (sub = ...:environment:production), and the deploy role trusts ...:ref:refs/heads/main.
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push the image
        id: image
        env:
          ROLLBACK_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            # Rollback: the image must already be in ECR; nothing is built.
            aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$ROLLBACK_TAG" >/dev/null \
              || { echo "No image tagged $ROLLBACK_TAG in ECR"; exit 1; }
            tag="$ROLLBACK_TAG"
          else
            tag="$GITHUB_SHA"
            uri="${{ steps.ecr.outputs.registry }}/$REPOSITORY:$tag"
            if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
              echo "Image for $tag already pushed; reusing it."
            else
              # --provenance=false: Lambda needs a plain image manifest, not an attestation index.
              docker buildx build --platform linux/arm64 --provenance=false -t "$uri" --push backend
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "uri=${{ steps.ecr.outputs.registry }}/$REPOSITORY:$tag" >> "$GITHUB_OUTPUT"

      - name: Migrate and sync the catalog
        # Always on push; optional when run by hand; never for a rollback.
        if: inputs.image_tag == '' && (github.event_name == 'push' || inputs.migrate)
        env:
          # The owner's DIRECT (non-pooler) connection string; migrations need it, the API doesn't.
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          test -n "$MIGRATE_DATABASE_URL" || { echo "Set the MIGRATE_DATABASE_URL secret"; exit 1; }
          run() { docker run --rm -e DATABASE_URL="$MIGRATE_DATABASE_URL" "${{ steps.image.outputs.uri }}" "$@"; }
          run alembic upgrade head
          run python -m app.catalog --apply

      - name: Deploy the stack
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          # Only ImageTag changes; `deploy` keeps every other parameter's current value. The
          # changes are applied by overloader-cfn-deploy (from the registry stack), not by this
          # role, which has no IAM or Lambda write access of its own.
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infra/api.yaml \
            --parameter-overrides ImageTag="${{ steps.image.outputs.tag }}" \
            --role-arn "arn:aws:iam::${account}:role/overloader-cfn-deploy" \
            --no-fail-on-empty-changeset
          echo "Deployed \`${{ steps.image.outputs.tag }}\` (stack $STACK)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          url=$(aws lambda get-function-url-config --function-name "$FUNCTION" --query FunctionUrl --output text)
          for i in 1 2 3; do curl -fsS --max-time 20 "${url}api/health" && break; sleep 5; done
          curl -fsS --max-time 20 "${url}api/health" | grep '"ok":true'
