AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Overloader: the API's image registry (ECR) and the role GitHub Actions uses to push images and
  deploy them. Stack 1 of 2; deploy in us-west-2 before api.yaml. See infra/README.md.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    Default: repo:GrantHolcombe@8533071/overloader@1473704173
    Description: >-
      The repository's OIDC subject prefix (gh api repos/OWNER/REPO/actions/oidc/customization/sub).
      Newer repos use immutable IDs (owner@id/name@id), which also stop a recreated repo with the
      same name from using this role. Only its main branch may deploy.
  FunctionName:
    Type: String
    Default: overloader-api
    Description: Name of the Lambda function api.yaml creates (the deploy role may update only it).

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: overloader-api
      # Each image is tagged with its git commit; a tag can never be pointed at different code.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 newest images (enough to roll back)",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }
      # Lambda pulls the image on the function's behalf; only this account's function may.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: overloader-github-deploy
      Description: GitHub Actions (main branch of the Overloader repo) pushes API images and updates the function.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsMainOnly
            Effect: Allow
            Principal:
              # Created for hiregrant.today; shared by every repo that deploys with GitHub Actions.
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: overloader-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushAndReadImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !GetAtt Repository.Arn
              - Sid: DeployThisFunctionOnly
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
