AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Overloader: the API's image registry (ECR), the role GitHub Actions uses to push images and
  deploy, the role CloudFormation uses for those deploys, and the API's own execution role.
  Everything IAM lives here, deployed by hand as root; GitHub can't change it. Deploy in
  us-west-2 before api.yaml. See infra/README.md.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    Default: repo:GrantHolcombe@8533071/overloader@1473704173
    Description: >-
      The repository's OIDC subject prefix (gh api repos/OWNER/REPO/actions/oidc/customization/sub).
      Newer repos use immutable IDs (owner@id/name@id), which also stop a recreated repo with the
      same name from using this role. Only its main branch may deploy.
  FunctionName:
    Type: String
    Default: overloader-api
    Description: Name of the Lambda function api.yaml creates (the deploy role may update only it).
  ApiStackName:
    Type: String
    Default: overloader-api
    Description: The CloudFormation stack made from api.yaml (GitHub Actions may update only it).

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: overloader-api
      # Each image is tagged with its git commit; a tag can never be pointed at different code.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 newest images (enough to roll back)",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }
      # Lambda pulls the image on the function's behalf; only this account's function may.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: overloader-github-deploy
      Description: GitHub Actions (main branch of the Overloader repo) pushes API images and updates the function.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsMainOnly
            Effect: Allow
            Principal:
              # Created for hiregrant.today; shared by every repo that deploys with GitHub Actions.
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubjectPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: overloader-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushAndReadImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !GetAtt Repository.Arn
              - Sid: ReadTheFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              # Deploys go through CloudFormation: the workflow updates the api stack's ImageTag
              # (every other parameter, secrets included, keeps its value), so the stack always
              # matches what's running. The changes themselves are made by CfnDeployRole below.
              - Sid: UpdateTheApiStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApiStackName}/*
              # Read-only: `aws cloudformation deploy` checks the template's parameters first.
              # It doesn't support resource-level scoping when given a template body.
              - Sid: ReadTemplateParameters
                Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: HandTheStackToTheServiceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnDeployRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # The role CloudFormation uses to apply api-stack changes started by GitHub Actions. It can
  # manage the one function, its URL, permissions and log group, and nothing in IAM except
  # handing the function its (fixed) execution role. What the API itself may do is decided by
  # ApiExecutionRole here, which only Grant changes (this stack is deployed by hand as root).
  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: overloader-cfn-deploy
      Description: CloudFormation applies overloader-api stack updates started by GitHub Actions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: overloader-api-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TheFunctionItsUrlAndPermissions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}:*
              - Sid: PullTheImage
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt Repository.Arn
              - Sid: ItsLogGroup
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}*
              - Sid: FindLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: GiveTheFunctionItsRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ApiExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # One-time cleanup: the first deploy through CloudFormation removes the execution
              # role the api stack used to create itself (overloader-api-role). Safe to delete
              # this statement after that deploy.
              - Sid: RemoveTheOldExecutionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/overloader-api-role

  # What the running API may do: write its own logs, nothing else (it reaches Neon and Resend
  # over the internet with credentials from its environment, not through IAM).
  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: overloader-api-exec
      Description: The Overloader API function. Writes its own logs and nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: overloader-api-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  CfnDeployRoleArn:
    Value: !GetAtt CfnDeployRole.Arn
  ApiExecutionRoleArn:
    Value: !GetAtt ApiExecutionRole.Arn
